name: e2e-pr

# Portão da main (AT-765): o E2E do brabo-qa roda sobre as imagens por DIGEST de uma PR para a `main` de
# api, engine, web, broker, infra ou qa, e fecha o check `E2E do brabo-qa` na PR de origem. O gatilho vem do
# reutilizável `qa-e2e-gatilho.yml` do brabo-ci (repository_dispatch `e2e-pr`). O `workflow_dispatch` é o ensaio manual.
on:
  repository_dispatch:
    types: [e2e-pr]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo da PR (ex.: brabo-api)'
        required: true
      pr:
        description: 'Número da PR'
        required: true
      head_sha:
        description: 'SHA do head da PR'
        required: true
      check_run_id:
        description: 'Id do check run E2E do brabo-qa já criado. 0 = ensaio sem check (AT-851): anunciar e fechar são pulados'
        required: true
      compose_ref:
        description: 'SHA (40 hex) ou tag vX.Y.Z do brabo-infra com o docker-compose.install.yml'
        required: true
        default: v1.0.0
      modo:
        description: 'completo (todas as specs, o portão da main) ou funcionalidades (só as tags @f-<id> de `funcionalidades`)'
        required: false
        default: completo
        type: choice
        options: [completo, funcionalidades]
      funcionalidades:
        description: 'Ids do catálogo separados por vírgula (só no modo funcionalidades), ex.: autenticacao,aprovacoes'
        required: false
        default: ''
      imagens:
        description: 'JSON por TAG {"api":"ghcr.io/viralabs-dev/brabo-api:v1.2.3-dev.4","engine":...,"web":...,"broker":...,"backup":...}'
        required: true

# A origem no nome (AT-773): o run do dispatch não diz quem o disparou. `c=` é a correlação (`<run_id>-<attempt>` do gatilho):
# o gatilho a procura no `display_title` para achar este run. Regressivo = payload com `modo` (PR para a dev); sem `modo` é o portão.
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
  && format('{0} ← {1}#{2} · {3} · {4} · c={5}',
  github.event.client_payload.modo && 'Regressivo' || 'E2E',
  github.event.client_payload.repo, github.event.client_payload.pr,
  github.event.client_payload.origem.sha_curto, github.event.client_payload.origem.ator,
  github.event.client_payload.origem.correlacao)
  || format('E2E ← {0}#{1} · ensaio manual · {2}', inputs.repo, inputs.pr, github.actor) }}

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.event.client_payload.repo || inputs.repo }}-${{ github.event.client_payload.pr || inputs.pr }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.10.0'
  PNPM_VERSION: '11.3.0'

jobs:
  # Executa código de PR (specs, pnpm install, compose): por isso NÃO tem o token do App. O `fechar` é que o tem.
  e2e:
    name: Rodar o E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    outputs:
      validar: ${{ steps.validar.outcome }}
      assinatura: ${{ steps.assinatura.outcome }}
      digest: ${{ steps.digest.outcome }}
      spec: ${{ steps.spec.outcome }}
      digests: ${{ steps.resultados.outputs.digests }}
      assinaturas: ${{ steps.resultados.outputs.assinaturas }}
      conferencia: ${{ steps.resultados.outputs.conferencia }}
      specs_falhas: ${{ steps.resultados.outputs.specs_falhas }}
      cobertura: ${{ steps.cobertura.outputs.cobertura }}
      funcionalidades: ${{ steps.relatorio.outputs.funcionalidades }}
      resumo: ${{ steps.relatorio.outputs.resumo }}
      html: ${{ steps.html.outputs.artifact-url }}
    # Valores CRUS: só o passo `validar` os lê (por env, nunca interpolados em script). Os validados vão ao GITHUB_ENV.
    env:
      RAW_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      RAW_PR: ${{ github.event.client_payload.pr || inputs.pr }}
      RAW_HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      RAW_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id || inputs.check_run_id }}
      RAW_COMPOSE_REF: ${{ github.event.client_payload.compose_ref || inputs.compose_ref }}
      RAW_IMAGENS: ${{ github.event_name == 'workflow_dispatch' && inputs.imagens || toJSON(github.event.client_payload.imagens) }}
      RAW_ORIGEM: ${{ toJSON(github.event.client_payload.origem) }}
      RAW_MODO: ${{ github.event.client_payload.modo || inputs.modo }}
      RAW_FUNCIONALIDADES: ${{ github.event_name == 'workflow_dispatch' && inputs.funcionalidades || toJSON(github.event.client_payload.funcionalidades) }}
      RAW_MOTIVOS: ${{ toJSON(github.event.client_payload.motivos) }}
      RAW_SEMDONO: ${{ toJSON(github.event.client_payload.semDono) }}
      RAW_TOCADAS: ${{ toJSON(github.event.client_payload.tocadas) }}
      RAW_SELECAO: ${{ toJSON(github.event.client_payload.selecao) }}
    steps:
      # Scripts e workflow vêm da `dev` (inclusive na PR do brabo-qa); só `e2e/` vem do head da PR. Exceção: o ensaio manual
      # (`workflow_dispatch`, só quem tem escrita) usa os scripts do próprio ref do workflow, para provar uma branch antes do merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'dev' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validar o payload
        id: validar
        run: node scripts/ci/validar-payload.ts

      # Só as specs (`e2e/`) vêm do head da PR do brabo-qa; nas outras PRs valem as da `dev`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ env.REPO == 'brabo-qa' }}
        with:
          ref: ${{ env.HEAD_SHA }}
          path: e2e-da-pr
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O compose do infra e os Vínculos (AT-773) vêm antes da espera das imagens: o Summary mostra a origem desde o começo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-infra
          ref: ${{ env.COMPOSE_REF }}
          path: brabo-infra
          persist-credentials: false

      - name: Vínculos
        uses: viralabs-dev/brabo-ci/.github/actions/vinculos@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
        with:
          origem: ${{ env.ORIGEM_JSON }}
          irmaos: |
            brabo-infra
            ${{ env.REPO == 'brabo-qa' && 'e2e-da-pr' || '' }}
          destino: Check na PR|https://github.com/viralabs-dev/${{ env.REPO }}/runs/${{ env.CHECK_RUN_ID }}

      # 30 min, a cada 30 s: a tag -dev.N pode ainda estar sendo carimbada quando a PR abre.
      - name: Aguardar as 5 imagens no GHCR
        id: aguardar
        run: node scripts/ci/aguardar-digest.ts digests.json

      - name: Verificar a assinatura (cosign) de cada digest
        id: assinatura
        run: |
          set -uo pipefail
          falhou=0
          echo '{}' > assinaturas.json
          for s in api engine web broker backup; do
            ref="$(jq -r --arg s "$s" '.[$s]' digests.json)"
            if cosign verify "$ref" \
              --certificate-identity-regexp '^https://github.com/viralabs-dev/brabo-(api|engine|web|broker|infra)/\.github/workflows/(release|ci)\.yml@' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null; then r=ok; else r=falhou; falhou=1; fi
            jq --arg s "$s" --arg r "$r" '.[$s]=$r' assinaturas.json > a.tmp && mv a.tmp assinaturas.json
          done
          exit "$falhou"

      # Mesmos campos do `gerar_segredos` do install.sh do brabo (que não é invocável à parte), com `openssl rand`,
      # novos a cada run. O NEO4J_PASSWORD é hex: uma `/` quebraria o parse de NEO4J_AUTH. base64 sem quebra de linha.
      - name: Gerar o .env
        working-directory: brabo-infra/docker
        run: |
          set -euo pipefail
          umask 077
          : > .env
          put() { echo "::add-mask::$2"; echo "$1=$2" >> .env; }
          b64() { openssl rand -base64 "$1" | tr -d '\n'; }
          for s in api engine web broker backup; do
            echo "BRABO_${s^^}_IMAGE=$(jq -r --arg s "$s" '.[$s]' "$GITHUB_WORKSPACE/digests.json")" >> .env
          done
          put GIT_OAUTH_STATE_SECRET "$(b64 32)"
          put AUTH_JWT_SECRET "$(b64 32)"
          put AUTH_TOKEN_PEPPER "$(b64 32)"
          put BRABO_SERVICE_TOKEN "$(b64 32)"
          put CREDENTIALS_MASTER_KEY "$(b64 32)"
          put SECRET_KEY_BASE "$(b64 64)"
          put NEO4J_PASSWORD "$(openssl rand -hex 24)"
          # AT-840: o catálogo inteiro bate no rate limit padrão (300/usuário, 600/IP por minuto) e no lockout por IP
          # (formato `falhas:segundos`, degraus crescentes). Só o compose de teste sobe os tetos; valores públicos, sem mascarar.
          { echo "RATE_LIMIT_USER=5000"; echo "RATE_LIMIT_IP=10000"; echo "AUTH_LOCKOUT_IP_THRESHOLDS=200:5"; } >> .env
          # AT-815 R4 (RN-1065): o roteiro do provider dublê da api, lido do checkout das specs; o `compose-duble.yml` o monta na api.
          echo "LLM_DUBLE_ROTEIRO_ARQUIVO=$GITHUB_WORKSPACE/$E2E_DIR/suporte/llm-duble-roteiro.json" >> .env
          # Senha do usuário do E2E: aleatória por run, usada pelo seed e pelas specs.
          senha="$(openssl rand -hex 16)"
          echo "::add-mask::$senha"
          echo "E2E_PASSWORD=$senha" >> "$GITHUB_ENV"

      - name: Subir o compose
        id: subir
        working-directory: brabo-infra
        # `backup` é um job (restart "no", sai com 0): o `--wait` o trata como falha. Sobe sem ele e só o CRIA,
        # para o `conferir-digests` (ps -a) achar o container da imagem de backup.
        run: |
          docker compose -f docker/docker-compose.install.yml -f "$GITHUB_WORKSPACE/$E2E_DIR/suporte/compose-duble.yml" --profile container-broker up -d --wait
          docker compose -f docker/docker-compose.install.yml --profile backup create backup

      # Para aqui se algum container roda outra imagem que não a do digest verificado.
      - name: Conferir o digest em execução
        id: digest
        working-directory: brabo-infra
        run: node "$GITHUB_WORKSPACE/scripts/ci/conferir-digests.ts" "$GITHUB_WORKSPACE/digests.json"

      # O seed provisiona o usuário que as specs usam (E2E_USER/E2E_PASSWORD, padrões do e2e/suporte/api.ts).
      - name: Semear o usuário do E2E
        working-directory: brabo-infra
        run: >
          docker compose -f docker/docker-compose.install.yml exec -T
          -e BRABO_SEED_PASSWORD="$E2E_PASSWORD" -e BRABO_FORCE_SEED=1 api node db/seed.js

      - name: Instalar o Playwright
        working-directory: ${{ env.E2E_DIR }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Specs do E2E
        id: spec
        working-directory: ${{ env.E2E_DIR }}
        env:
          CI: 'true'
          E2E_WEB_URL: http://localhost:8088
          E2E_API_URL: http://localhost:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: resultado.json
        # `completo` (padrão, o portão da main) roda tudo; `funcionalidades` filtra pelas tags @f-<id> (GREP validado e montado no payload).
        # O token de serviço (rotas internas das specs, AT-815 P3) entra só no ambiente do Playwright: mascarado, nunca impresso.
        run: |
          # O script vem do checkout do qa do E2E (a PR do qa, ou a dev): a PR já executa as specs com o token, então não ganha exposição.
          qa="$GITHUB_WORKSPACE/$(dirname "$E2E_DIR")"
          com_token() { bash "$qa/scripts/ci/com-token-de-servico.sh" "$GITHUB_WORKSPACE/brabo-infra/docker/.env" -- "$@"; }
          if [ "$MODO" = funcionalidades ]; then
            com_token pnpm test --grep "$GREP" --reporter=list,github,html,json
          else
            com_token pnpm test --reporter=list,github,html,json
          fi

      # Tabela por funcionalidade (AT-769); funcionalidade sem spec é "sem cobertura" e não reprova.
      - name: Cobertura por funcionalidade
        id: cobertura
        if: always()
        continue-on-error: true
        run: node scripts/ci/cobertura.ts

      - name: Logs dos containers
        if: always()
        working-directory: brabo-infra
        run: docker compose -f docker/docker-compose.install.yml --profile container-broker --profile backup logs --no-color > "$GITHUB_WORKSPACE/containers.log" 2>&1 || true

      # O HTML do Playwright vai à parte do zip do E2E (AT-791): o link entra no Summary e no check.
      - name: Relatório HTML do Playwright
        id: html
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: relatorio-html-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ env.E2E_DIR }}/playwright-report

      # Relatório de decisão (AT-791): escreve o Summary e os arquivos do artefato; a saída `resumo` é o JSON compacto para o `fechar`.
      - name: Relatório
        id: relatorio
        if: always()
        continue-on-error: true
        env:
          ASSINATURA: ${{ steps.assinatura.outcome }}
          DIGEST: ${{ steps.digest.outcome }}
          SPEC: ${{ steps.spec.outcome }}
          HTML_URL: ${{ steps.html.outputs.artifact-url }}
          ARTEFATO_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: node scripts/ci/relatorio.ts

      - name: Artefato do relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: relatorio-regressivo-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            relatorio-regressivo.md
            relatorio-regressivo.json

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ env.E2E_DIR }}/test-results
            ${{ env.E2E_DIR }}/resultado.json
            digests.json
            assinaturas.json
            conferencia.json
            containers.log

      # Resultados em linha única, para o job `fechar` (sem artefato: nenhum arquivo de PR é baixado lá).
      - name: Resultados para o fechamento
        id: resultados
        if: always()
        run: |
          um() { [ -f "$1" ] && jq -c . "$1" 2>/dev/null || echo null; }
          {
            echo "digests=$(um digests.json)"
            echo "assinaturas=$(um assinaturas.json)"
            echo "conferencia=$(um conferencia.json)"
            r="${E2E_DIR:-e2e}/resultado.json"
            if [ -f "$r" ]; then echo "specs_falhas=$(jq -c '[.. | objects | select(has("specs")) | .specs[] | select(.ok == false) | .title] | .[:50]' "$r" 2>/dev/null || echo '[]')"; else echo 'specs_falhas=[]'; fi
          } >> "$GITHUB_OUTPUT"

  # Exibição (AT-791): uma linha por funcionalidade com spec executada no grafo do run. NÃO roda nada e não tem token nem checkout:
  # só lê o resumo do job e2e (dado de PR) e sai vermelho se a funcionalidade falhou. O portão continua sendo o `fechar`.
  funcionalidade:
    name: Funcionalidade · ${{ matrix.id }}
    needs: e2e
    if: ${{ always() && needs.e2e.outputs.funcionalidades != '' && needs.e2e.outputs.funcionalidades != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.e2e.outputs.funcionalidades) }}
    env:
      ID: ${{ matrix.id }}
      RESUMO: ${{ needs.e2e.outputs.resumo }}
    steps:
      - name: Specs da funcionalidade
        run: |
          set -uo pipefail
          [[ "$ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::id inválido"; exit 1; }
          lista="$(jq -r --arg id "$ID" '[.specs[] | select(.funcionalidades | index($id))]
            | .[] | "| \(.status) | \(.titulo | gsub("[|`<]"; " ") | .[0:120]) | \(.duracao_ms / 1000 | floor)s |"' <<<"$RESUMO")"
          { echo "### $ID"; echo; echo '| status | spec | tempo |'; echo '|---|---|---|'; echo "$lista"; } >> "$GITHUB_STEP_SUMMARY"
          flaky="$(jq --arg id "$ID" '[.specs[] | select((.funcionalidades | index($id)) and .status == "flaky")] | length' <<<"$RESUMO")"
          falhou="$(jq --arg id "$ID" '[.specs[] | select((.funcionalidades | index($id)) and .status == "falhou")] | length' <<<"$RESUMO")"
          [ "$flaky" -gt 0 ] && echo "::warning::$flaky spec(s) flaky em $ID"
          [ "$falhou" -eq 0 ]

  # Aponta o check da PR para ESTE run assim que ele começa (AT-773); o `fechar` o conclui. Só avisa se falhar.
  anunciar:
    name: Anunciar no check
    # Ensaio manual com check_run_id=0 (AT-851): não há check para apontar.
    if: ${{ (github.event.client_payload.check_run_id || inputs.check_run_id) != '0' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    env:
      RAW_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      RAW_PR: ${{ github.event.client_payload.pr || inputs.pr }}
      RAW_HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      RAW_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id || inputs.check_run_id }}
      RAW_COMPOSE_REF: ${{ github.event.client_payload.compose_ref || inputs.compose_ref }}
      RAW_IMAGENS: ${{ github.event_name == 'workflow_dispatch' && inputs.imagens || toJSON(github.event.client_payload.imagens) }}
      RAW_ORIGEM: ${{ toJSON(github.event.client_payload.origem) }}
    steps:
      # Checkout LIMPO da `dev`: nada de PR neste job, que tem o token do App.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validar o payload
        id: validar
        continue-on-error: true
        run: node scripts/ci/validar-payload.ts
      - name: Vínculos
        id: vinculos
        uses: viralabs-dev/brabo-ci/.github/actions/vinculos@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
        with:
          origem: ${{ env.ORIGEM_JSON }}
          destino: Check na PR|https://github.com/viralabs-dev/${{ env.REPO }}/runs/${{ env.CHECK_RUN_ID }}
      - name: Token do App
        id: app
        if: ${{ steps.validar.outputs.repo != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.BRABO_APP_ID }}
          private-key: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
          owner: viralabs-dev
          repositories: ${{ steps.validar.outputs.repo }}
          permission-checks: write
      - name: Apontar o check para este run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ secrets.BRABO_APP_ID }}
          VINCULOS_MD: ${{ steps.vinculos.outputs.arquivo }}
        run: node scripts/ci/anunciar-check.ts

  fechar:
    name: Fechar o check
    needs: e2e
    # Ensaio manual com check_run_id=0 (AT-851): não há check para fechar; o resultado é o do job `e2e`.
    if: ${{ always() && (github.event.client_payload.check_run_id || inputs.check_run_id) != '0' }}
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      RAW_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      RAW_PR: ${{ github.event.client_payload.pr || inputs.pr }}
      RAW_HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      RAW_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id || inputs.check_run_id }}
      RAW_COMPOSE_REF: ${{ github.event.client_payload.compose_ref || inputs.compose_ref }}
      RAW_IMAGENS: ${{ github.event_name == 'workflow_dispatch' && inputs.imagens || toJSON(github.event.client_payload.imagens) }}
      RAW_ORIGEM: ${{ toJSON(github.event.client_payload.origem) }}
      RAW_MODO: ${{ github.event.client_payload.modo || inputs.modo }}
      RAW_FUNCIONALIDADES: ${{ github.event_name == 'workflow_dispatch' && inputs.funcionalidades || toJSON(github.event.client_payload.funcionalidades) }}
      RAW_MOTIVOS: ${{ toJSON(github.event.client_payload.motivos) }}
      RAW_SEMDONO: ${{ toJSON(github.event.client_payload.semDono) }}
      RAW_TOCADAS: ${{ toJSON(github.event.client_payload.tocadas) }}
      RAW_SELECAO: ${{ toJSON(github.event.client_payload.selecao) }}
    steps:
      # Checkout LIMPO da `dev`: nada de PR neste job, que é o único com o token do App.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-ci
          ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
          path: .brabo-ci
          persist-credentials: false
        continue-on-error: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validar o payload de novo
        id: validar
        continue-on-error: true
        run: node scripts/ci/validar-payload.ts

      - name: Vínculos
        id: vinculos
        uses: viralabs-dev/brabo-ci/.github/actions/vinculos@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
        with:
          origem: ${{ env.ORIGEM_JSON }}
          destino: Check na PR|https://github.com/viralabs-dev/${{ env.REPO }}/runs/${{ env.CHECK_RUN_ID }}

      # Escrita no brabo-qa equivale a poder aprovar o portão (README). Escopo: só o repo validado, `checks: write` e `issues: write` (comentário fixo da PR).
      - name: Token do App
        id: app
        if: ${{ steps.validar.outputs.repo != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.BRABO_APP_ID }}
          private-key: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
          owner: viralabs-dev
          repositories: ${{ steps.validar.outputs.repo }}
          permission-checks: write
          permission-issues: write  # o comentário fixo da PR (AT-791)
          permission-pull-requests: write  # o comentário fixo da PR (AT-791): sem isto, 403

      - name: Fechar o check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ secrets.BRABO_APP_ID }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VALIDAR: ${{ needs.e2e.outputs.validar }}
          JOB: ${{ needs.e2e.result }}
          ASSINATURA: ${{ needs.e2e.outputs.assinatura }}
          DIGEST: ${{ needs.e2e.outputs.digest }}
          SPEC: ${{ needs.e2e.outputs.spec }}
          DIGESTS: ${{ needs.e2e.outputs.digests }}
          ASSINATURAS: ${{ needs.e2e.outputs.assinaturas }}
          CONFERENCIA: ${{ needs.e2e.outputs.conferencia }}
          SPECS_FALHAS: ${{ needs.e2e.outputs.specs_falhas }}
          COBERTURA: ${{ needs.e2e.outputs.cobertura }}
          RELATORIO: ${{ needs.e2e.outputs.resumo }}
          HTML_URL: ${{ needs.e2e.outputs.html }}
          VINCULOS_MD: ${{ steps.vinculos.outputs.arquivo }}
        run: node scripts/ci/fechar-check.ts
