name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
    with:
      ci_ref: d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
    with:
      ci_ref: d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
