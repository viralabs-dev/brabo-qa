name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@42feff38bd850fa2a9fac650597d957d2755c8b6  # brabo-ci dev, merge da ci#30
    with:
      ci_ref: 42feff38bd850fa2a9fac650597d957d2755c8b6  # brabo-ci dev, merge da ci#30
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@42feff38bd850fa2a9fac650597d957d2755c8b6  # brabo-ci dev, merge da ci#30
    with:
      ci_ref: 42feff38bd850fa2a9fac650597d957d2755c8b6  # brabo-ci dev, merge da ci#30
