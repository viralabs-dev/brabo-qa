name: qa-e2e

# Liga o E2E do brabo-qa nas PRs para a main (portão da main, AT-765) e para a dev (regressivo, AT-851).
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  qa-e2e:
    uses: viralabs-dev/brabo-ci/.github/workflows/qa-e2e-gatilho.yml@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
