name: qa-e2e

# Liga o E2E do brabo-qa nas PRs para a main (portão da main, AT-765).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  qa-e2e:
    uses: viralabs-dev/brabo-ci/.github/workflows/qa-e2e-gatilho.yml@d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
    with:
      ci_ref: d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
