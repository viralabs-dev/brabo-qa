    branches: [dev, main]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  carimbar:
    uses: viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
    with:
      ci_ref: d122b836648045df350986111fbf3213b4750918  # v1.4.0-dev.4
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
