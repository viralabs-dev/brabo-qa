name: varrer-orfaos

# Fecha como vermelho (causa `sem-resposta`) o check `E2E do brabo-qa` em andamento há mais de 90 min (AT-765):
# o run que o fecharia foi perdido (runner caído, dispatch sem resposta). Varre as PRs abertas para a `main` dos 6 repos.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: varrer-orfaos
  cancel-in-progress: false

env:
  NODE_VERSION: '26.10.0'

jobs:
  varrer:
    name: Varrer checks órfãos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Token do App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.BRABO_APP_ID }}
          private-key: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
          owner: viralabs-dev
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # repinar no merge da L1 (AT-765 Task 10)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-ci
          ref: feature/e2e-portao-da-main
          path: .brabo-ci
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Varrer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRABO_APP_ID: ${{ secrets.BRABO_APP_ID }}
        run: node scripts/ci/varrer-orfaos.ts
